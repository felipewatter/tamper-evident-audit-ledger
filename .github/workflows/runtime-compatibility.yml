name: Minimum Node runtime compatibility
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-smoke:
    name: Compiled CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22.12.0', '24']
    steps:
      - name: Checkout pull request without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build using supported developer Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked development dependencies and compile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Switch to declared compatible runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify compiled package loads on target runtime
        run: |
          node --version
          node --check dist/cli.js
          node -e "require('./dist/index.js')"
          node dist/cli.js --help
          node dist/cli.js verify --help
