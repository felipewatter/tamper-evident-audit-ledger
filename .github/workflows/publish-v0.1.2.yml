name: Publish v0.1.2 after validated CI
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tamper-evident-audit-ledger-v0.1.2
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'felipewatter/tamper-evident-audit-ledger' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build verified npm package and publish GitHub assets only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TESTED_SHA"
          test "$(node -p 'require("./package.json").version')" = '0.1.2'
          test "$(node -p 'require("./package-lock.json").version')" = '0.1.2'
          if gh release view v0.1.2 --repo "$GH_REPO" >/dev/null 2>&1; then exit 0; fi
          if git ls-remote --tags origin refs/tags/v0.1.2 | grep -q .; then echo 'Existing tag must never be reused'; exit 1; fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --if-present
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          (cd release-assets && sha256sum *.tgz > SHA256SUMS)
          { echo '# tamper-evident-audit-ledger v0.1.2'; echo; echo 'Changes since v0.1.1:'; git log --format='- %s (%h)' v0.1.1..HEAD; } > release-notes.txt
          gh release create v0.1.2 release-assets/* --repo "$GH_REPO" --target "$TESTED_SHA" \
            --title 'tamper-evident-audit-ledger v0.1.2' --notes-file release-notes.txt --latest
