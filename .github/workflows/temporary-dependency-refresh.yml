name: Temporary Dependency Refresh (auto-removal required)
on:
  push:
    branches: [improvement/integrity-ci-hardening]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: improvement/integrity-ci-hardening
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh outdated vulnerable test tooling
        run: |
          npm install --save-dev 'vitest@^4.1.12' --ignore-scripts --no-audit --no-fund
          npm audit fix --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Persist updated package lock via restricted branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh audited npm dependencies"
            git push origin HEAD:improvement/integrity-ci-hardening
          fi
